<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f7f4"><meta name="apple-mobile-web-app-capable" content="yes"><title>My Music · 私人音樂空間</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-title" content="My Music"><meta name="mobile-web-app-capable" content="yes"><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#2c3035;background:#f8f7f4}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #9eaecc;outline-offset:2px}.wrap{max-width:1100px;margin:auto;padding:26px 22px 45px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:25px}.eyebrow{font-size:11px;letter-spacing:2px;color:#899097;font-weight:700}h1{margin:5px 0 2px;font-size:30px;letter-spacing:-1px}.muted{color:#858b92;font-size:13px}.primary{background:#333c48;color:white;border:0;border-radius:13px;padding:13px 18px;font-weight:700}.primary:hover{background:#536171}.layout{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:22px}.panel{background:#fff;border:1px solid #ecebe7;border-radius:25px;padding:26px;box-shadow:0 10px 35px #252b3510}.art{height:260px;border-radius:20px;background:linear-gradient(140deg,#f2eee7,#dfe4e8);display:grid;place-items:center;margin-bottom:20px}.disc{width:148px;height:148px;border-radius:50%;background:repeating-radial-gradient(circle,#cbd2d9 0 3px,#dfe4e9 4px 10px);display:grid;place-items:center;box-shadow:0 15px 30px #50586220}.disc:after{content:'';width:40px;height:40px;background:#fff;border:11px solid #a6b0bb;border-radius:50%}.playing .disc{animation:spin 12s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.center{text-align:center}h2{font-size:20px;margin:8px 0;overflow-wrap:anywhere}.tag{font-size:11px;letter-spacing:1.5px;color:#8d959c}.range{width:100%;accent-color:#556474;cursor:pointer}.time{display:flex;justify-content:space-between;font-size:12px;color:#8b9198}.controls{display:flex;align-items:center;justify-content:center;gap:15px;margin:21px 0}.round{border:1px solid #e5e7e8;background:#fff;color:#35404b;width:49px;height:49px;border-radius:50%;font-size:21px}.round.big{width:65px;height:65px;background:#35404b;color:white;border:0;font-size:24px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.options{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.chip{border:1px solid #e4e7e8;background:#fafafa;border-radius:12px;padding:9px 12px;color:#65707a;font-size:13px}.chip.active{background:#e9edf1;border-color:#b8c3cc;color:#303e4a}.vol{margin-top:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{margin:0}.count{background:#f0f2f3;padding:5px 10px;border-radius:20px;color:#67717b;font-size:12px}.folderbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 3px}.folder{border:1px solid #e4e7e8;border-radius:12px;background:#fafafa;color:#55616c;padding:9px 12px;font-size:13px}.folder.active{background:#35404b;color:white;border-color:#35404b}.category-select{border:1px solid #e4e7e8;background:#fff;border-radius:9px;color:#64707a;padding:7px;max-width:110px;font-size:12px}.foldertools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.search{width:100%;border:1px solid #e5e8ea;background:#fafafa;border-radius:13px;padding:13px;margin:19px 0 12px;color:#303841}.list{list-style:none;margin:0;padding:0;max-height:455px;overflow:auto}.item{display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f0ee;padding:9px 0}.num{font-size:12px;color:#a0a6ab;min-width:25px;text-align:center}.song{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:8px 0;color:#424a52;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.current .song{font-weight:700;color:#283f57}.heart,.remove{border:0;background:transparent;font-size:21px;color:#a4adb6;padding:7px}.heart.liked{color:#d17e88}.remove{font-size:17px}.empty{text-align:center;padding:44px 10px;color:#89929a;font-size:14px;line-height:1.8}.foot{font-size:12px;color:#929aa0;text-align:center;margin-top:17px}.status{font-size:12px;color:#747e87;margin-top:12px;min-height:18px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:750px){.layout{grid-template-columns:1fr}.wrap{padding:19px 13px 30px}header{align-items:flex-start}h1{font-size:26px}.panel{padding:19px;border-radius:20px}.art{height:210px}.disc{width:125px;height:125px}.primary{padding:12px;font-size:13px}.list{max-height:420px}}@media(prefers-reduced-motion:reduce){.playing .disc{animation:none}}
</style></head><body><main class="wrap"><header><div><div class="eyebrow">YOUR PERSONAL MUSIC SPACE</div><h1>My Music ♫</h1><div class="muted">簡單聆聽，純粹喜歡。</div></div><div><button class="primary" id="import">＋ 匯入音樂</button><input class="visually-hidden" id="files" type="file" accept="audio/*,.mp3" multiple></div></header><div class="layout"><section class="panel"><div class="art" id="art"><div class="disc"></div></div><div class="center"><div class="tag">NOW PLAYING</div><h2 id="title">選一首喜歡的歌</h2><div class="muted" id="subtitle">匯入 MP3，開始你的音樂時光</div></div><div style="margin-top:25px"><input class="range" id="seek" aria-label="播放進度" type="range" min="0" max="100" value="0"><div class="time"><span id="elapsed">0:00</span><span id="duration">0:00</span></div></div><div class="controls"><button class="round" id="prev" aria-label="上一首">⏮</button><button class="round big" id="play" aria-label="播放">▶</button><button class="round" id="next" aria-label="下一首">⏭</button></div><div class="options"><button class="chip" id="shuffle">⇄ 隨機：關</button><button class="chip" id="repeat">↻ 循環：全部</button></div><div class="vol"><div class="row"><span class="muted">音量</span><span class="muted" id="volText">80%</span></div><input class="range" id="volume" aria-label="音量" type="range" min="0" max="1" step="0.01" value="0.8"></div></section><section class="panel"><div class="head"><h2>我的音樂庫</h2><span class="count" id="count">0 首歌曲</span></div><div class="row" style="margin-top:15px"><button class="chip" id="favorites">♡ 只看最愛</button><button class="chip" id="clear">清空音樂庫</button></div><div class="folderbar" id="folders" aria-label="音樂分類"></div><div class="foldertools"><button class="chip" id="addFolder">＋ 新增分類</button><button class="chip" id="renameFolder">重新命名</button><button class="chip" id="deleteFolder">刪除分類</button></div><input class="search" id="search" placeholder="搜尋歌曲名稱…" aria-label="搜尋歌曲"><ul class="list" id="songs"></ul><div class="status" id="status" role="status"></div><div class="foot">私人本機音樂庫 · 不需帳號 · 不上傳檔案</div></section></div></main><audio id="audio" preload="metadata"></audio><script>
'use strict';const $=id=>document.getElementById(id),audio=$('audio');let tracks=[],index=-1,shuffle=false,repeat=0,onlyFav=false,db=null;let categories;try{categories=JSON.parse(localStorage.getItem('mm4_categories')||'null')}catch(e){}if(!Array.isArray(categories))categories=['英語','日語','音樂','錄音'];categories=[...new Set(categories.filter(x=>typeof x==='string'&&x.trim()))];let activeFolder='全部';const saveCategories=()=>localStorage.setItem('mm4_categories',JSON.stringify(categories));const favorites=new Set(JSON.parse(localStorage.getItem('mm2_favs')||'[]'));audio.volume=.8;const fmt=s=>Number.isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';const key=f=>f.name+'|'+f.size+'|'+f.lastModified;const say=t=>$('status').textContent=t;function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(Error('此瀏覽器不支援離線儲存'));return}const req=indexedDB.open('my-music-v2',1);req.onupgradeneeded=()=>req.result.createObjectStore('songs',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}function tx(mode,fn){return new Promise((resolve,reject)=>{const t=db.transaction('songs',mode),s=t.objectStore('songs');fn(s);t.oncomplete=()=>resolve();t.onerror=()=>reject(t.error)})}function allSaved(){return new Promise((resolve,reject)=>{const r=db.transaction('songs').objectStore('songs').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function persistFav(){localStorage.setItem('mm2_favs',JSON.stringify([...favorites]))}function renderFolders(){const bar=$('folders');bar.replaceChildren();for(const name of ['全部','未分類',...categories]){const b=document.createElement('button');b.className='folder'+(activeFolder===name?' active':'');b.textContent='▤ '+name;b.onclick=()=>{activeFolder=name;render()};bar.append(b)}$('renameFolder').disabled=!categories.includes(activeFolder);$('deleteFolder').disabled=!categories.includes(activeFolder)}async function changeCategory(t,value){t.category=value;if(db)try{await tx('readwrite',store=>store.put({id:t.id,name:t.name,blob:t.blob,category:value}))}catch(e){say('分類儲存失敗，請檢查裝置空間')}render()}function render(){renderFolders();const q=$('search').value.trim().toLocaleLowerCase(),list=$('songs');list.replaceChildren();$('count').textContent=tracks.length+' 首歌曲';tracks.forEach((t,i)=>{if(!t.name.toLocaleLowerCase().includes(q)||(onlyFav&&!favorites.has(t.id))||(activeFolder!=='全部'&&(activeFolder==='未分類'?Boolean(t.category):t.category!==activeFolder)))return;const li=document.createElement('li');li.className='item'+(i===index?' current':'');const num=document.createElement('span');num.className='num';num.textContent=String(i+1).padStart(2,'0');const song=document.createElement('button');song.className='song';song.textContent=t.name;song.title=t.name;song.onclick=()=>load(i,true);const heart=document.createElement('button');heart.className='heart'+(favorites.has(t.id)?' liked':'');heart.textContent=favorites.has(t.id)?'♥':'♡';heart.setAttribute('aria-label','切換最愛');heart.onclick=()=>{favorites.has(t.id)?favorites.delete(t.id):favorites.add(t.id);persistFav();render()};const del=document.createElement('button');del.className='remove';del.textContent='×';del.setAttribute('aria-label','移除 '+t.name);del.onclick=()=>remove(i);const sel=document.createElement('select');sel.className='category-select';sel.setAttribute('aria-label','設定 '+t.name+' 的分類');for(const name of ['未分類',...categories]){const opt=document.createElement('option');opt.value=name==='未分類'?'':name;opt.textContent=name;sel.append(opt)}sel.value=t.category||'';sel.onchange=()=>changeCategory(t,sel.value);li.append(num,song,sel,heart,del);list.append(li)});if(!list.children.length){const li=document.createElement('li');li.className='empty';li.textContent=tracks.length?'找不到符合條件的歌曲':'還沒有音樂。按「匯入音樂」加入你的 MP3。';list.append(li)}}function load(i,autoplay=false){if(!tracks.length)return;index=(i+tracks.length)%tracks.length;audio.src=tracks[index].url;$('title').textContent=tracks[index].name;$('subtitle').textContent='我的私人音樂收藏';$('seek').value=0;$('elapsed').textContent='0:00';render();if(autoplay)audio.play().catch(()=>say('請按播放鍵開始聆聽'))}function reset(){audio.pause();audio.removeAttribute('src');audio.load();index=-1;$('title').textContent='選一首喜歡的歌';$('subtitle').textContent='匯入 MP3，開始你的音樂時光';$('seek').value=0;$('elapsed').textContent='0:00';$('duration').textContent='0:00'}async function remove(i){const t=tracks[i];if(db)try{await tx('readwrite',s=>s.delete(t.id))}catch(e){say('無法更新離線音樂庫')};URL.revokeObjectURL(t.url);tracks.splice(i,1);if(i===index){reset();if(tracks.length)load(Math.min(i,tracks.length-1))}else if(i<index)index--;render()}function step(dir){if(!tracks.length)return;if(shuffle&&tracks.length>1){let n;do{n=Math.floor(Math.random()*tracks.length)}while(n===index);load(n,true)}else load(index+dir,true)}$('addFolder').onclick=()=>{const name=prompt('請輸入新分類名稱（例如：古典音樂）');if(name===null)return;const v=name.trim();if(!v||v.length>30||['全部','未分類'].includes(v)||categories.includes(v)){say('分類名稱不可空白、重複或超過30字');return}categories.push(v);saveCategories();activeFolder=v;render();say('已建立分類：'+v)};$('renameFolder').onclick=async()=>{if(!categories.includes(activeFolder))return;const old=activeFolder;const name=prompt('修改分類名稱',old);if(name===null)return;const v=name.trim();if(!v||v.length>30||['全部','未分類'].includes(v)||(v!==old&&categories.includes(v))){say('分類名稱不可空白、重複或超過30字');return}categories[categories.indexOf(old)]=v;saveCategories();for(const t of tracks.filter(t=>t.category===old))await changeCategory(t,v);activeFolder=v;render();say('分類已更名')};$('deleteFolder').onclick=async()=>{if(!categories.includes(activeFolder)||!confirm('刪除此分類？歌曲會移到「未分類」，不會刪除音檔。'))return;const old=activeFolder;categories=categories.filter(x=>x!==old);saveCategories();for(const t of tracks.filter(t=>t.category===old))await changeCategory(t,'');activeFolder='全部';render();say('分類已刪除，歌曲仍保留')};$('import').onclick=()=>$('files').click();$('files').onchange=async e=>{const files=[...e.target.files].filter(f=>f.type.startsWith('audio/')||/\.mp3$/i.test(f.name));let added=0,unsaved=0;for(const file of files){const id=key(file);if(tracks.some(t=>t.id===id))continue;const blob=file;const category=categories.includes(activeFolder)?activeFolder:'';tracks.push({id,name:file.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(blob),blob,category});added++;if(db)try{await tx('readwrite',s=>s.put({id,name:file.name.replace(/\.[^.]+$/,''),blob,category}))}catch(err){unsaved++}else unsaved++}render();if(index<0&&tracks.length)load(0);say(added+' 首歌曲已加入'+(unsaved?'；其中 '+unsaved+' 首未能永久儲存，重新開啟可能需再次匯入':'，已嘗試儲存在此裝置'));e.target.value=''};$('play').onclick=()=>{if(index<0){if(tracks.length)load(0,true);return}audio.paused?audio.play().catch(()=>say('無法播放此音檔')):audio.pause()};$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);audio.onplay=()=>{$('play').textContent='⏸';$('play').setAttribute('aria-label','暫停');$('art').classList.add('playing')};audio.onpause=()=>{$('play').textContent='▶';$('play').setAttribute('aria-label','播放');$('art').classList.remove('playing')};audio.ontimeupdate=()=>{$('seek').value=audio.duration?audio.currentTime/audio.duration*100:0;$('elapsed').textContent=fmt(audio.currentTime)};audio.onloadedmetadata=()=>$('duration').textContent=fmt(audio.duration);$('seek').oninput=e=>{if(audio.duration)audio.currentTime=Number(e.target.value)/100*audio.duration};$('volume').oninput=e=>{audio.volume=Number(e.target.value);$('volText').textContent=Math.round(audio.volume*100)+'%'};$('shuffle').onclick=()=>{shuffle=!shuffle;$('shuffle').textContent='⇄ 隨機：'+(shuffle?'開':'關');$('shuffle').classList.toggle('active',shuffle)};$('repeat').onclick=()=>{repeat=(repeat+1)%3;$('repeat').textContent='↻ 循環：'+['全部','單曲','關閉'][repeat]};audio.onended=()=>{if(repeat===1){audio.currentTime=0;audio.play().catch(()=>{})}else if(shuffle||index<tracks.length-1||repeat===0)step(1)};$('search').oninput=render;$('favorites').onclick=()=>{onlyFav=!onlyFav;$('favorites').classList.toggle('active',onlyFav);$('favorites').textContent=onlyFav?'♥ 顯示全部':'♡ 只看最愛';render()};$('clear').onclick=async()=>{if(!tracks.length||!confirm('確定要清空此裝置的音樂庫嗎？'))return;if(db)try{await tx('readwrite',s=>s.clear())}catch(e){say('無法清除儲存資料')};tracks.forEach(t=>URL.revokeObjectURL(t.url));tracks=[];reset();render();say('音樂庫已清空')};(async()=>{try{db=await openDB();const saved=await allSaved();for(const t of saved)tracks.push({id:t.id,name:t.name,url:URL.createObjectURL(t.blob),blob:t.blob,category:t.category||''});if(tracks.length){load(0);say('已載入本機保存的 '+tracks.length+' 首歌曲')}else say('音樂只會保存在這台裝置，不會上傳雲端')}catch(e){say('此瀏覽器可能無法保存音樂，請保留原始 MP3 檔案')}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
