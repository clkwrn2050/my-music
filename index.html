// Player additions are presentation and audio state only. Song storage schema is unchanged.
function renderQueue(){
 const q=$('upNext');q.replaceChildren();if(!tracks.length){$('queueCount').textContent='尚無歌曲';const empty=document.createElement('div');empty.className='extra-sub';empty.textContent='從右上角選單匯入歌曲，即可顯示播放清單。';q.append(empty);return}
 $('queueCount').textContent=shuffle?'隨機模式：順序僅供參考':'依音樂庫順序';
 const start=index<0?0:index+1;let ids=[];for(let n=0;n<Math.min(3,tracks.length-(index<0?0:1));n++){let i=start+n;if(i>=tracks.length){if(repeat!==0)break;i%=tracks.length}ids.push(i)}
 if(!ids.length&&repeat===0)ids=[0];
 ids.forEach(i=>{const t=tracks[i],b=document.createElement('button');b.className='queue-track';b.type='button';const n=document.createElement('span');n.className='q-num';n.textContent=String(i+1).padStart(2,'0');const name=document.createElement('span');name.className='q-title';name.textContent=t.name;b.append(n,name);b.onclick=()=>load(i,true);q.append(b)});
 if(!q.children.length){const empty=document.createElement('div');empty.className='extra-sub';empty.textContent='已到清單最後一首';q.append(empty)}
}
const themes=['navy','obsidian','forest','cream'];
function applyTheme(v){const theme=themes.includes(v)?v:'navy';document.documentElement.dataset.theme=theme;try{localStorage.setItem('mm56_theme',theme)}catch(e){}document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('selected',b.dataset.theme===theme));document.querySelector('meta[name="theme-color"]').content=({navy:'#101824',obsidian:'#141414',forest:'#152820',cream:'#eae3d7'})[theme]}
$('menuThemes').onclick=()=>{closeMenu();$('themeDialog').hidden=false};
$('closeThemes').onclick=()=>$('themeDialog').hidden=true;
$('themeDialog').onclick=e=>{if(e.target===$('themeDialog'))$('themeDialog').hidden=true};
document.querySelectorAll('.theme-grid button').forEach(b=>b.onclick=()=>{applyTheme(b.dataset.theme);$('themeDialog').hidden=true});
try{applyTheme(localStorage.getItem('mm56_theme')||'navy')}catch(e){applyTheme('navy')}
renderQueue();
</script></body></html>
